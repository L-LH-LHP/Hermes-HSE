<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面向邮件数据的可搜索加密系统 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-intro">
            <div class="brand-block">
                <div class="brand-mark">邮</div>
                <div class="brand-copy">
                    <strong>面向邮件数据的可搜索加密系统</strong>
                    <span>角色工作台入口</span>
                </div>
            </div>
            <h1>角色认证登录</h1>
            <p class="subtitle">选择审计员、写者或管理员身份，进入对应工作台。</p>
        </section>

        <section class="card auth-card">
            <h2>登录</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-role">角色</label>
                    <select id="login-role" required>
                        <option value="reader">读者（审计员）</option>
                        <option value="writer">写者</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>

                <div class="form-group" id="reader-username-group">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username" value="reader" autocomplete="username">
                </div>

                <div class="form-group" id="writer-id-group" style="display: none;">
                    <label for="login-writer-id">写者 ID（0-based）</label>
                    <input type="number" id="login-writer-id" min="0" placeholder="例如: 0">
                </div>

                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" required autocomplete="current-password" placeholder="输入密码">
                    <small id="login-hint">默认读者账号：reader / reader123</small>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">登录</span>
                    <span class="btn-loading" style="display: none;">登录中...</span>
                </button>
            </form>
            <div id="login-result" class="result-message" style="display: none; margin-top: 1rem;"></div>
        </section>
    </main>

    <div id="toast" class="toast"></div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
