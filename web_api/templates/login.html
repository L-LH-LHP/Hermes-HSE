<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面向云端数据的多写者可搜索加密系统 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-intro">
            <div class="brand-block">
                <div class="brand-mark" aria-hidden="true">
                    <span class="brand-cloud-core">云</span>
                    <span class="brand-cloud-orbit"></span>
                </div>
                <div class="brand-copy">
                    <strong>面向云端数据的多写者可搜索加密系统</strong>
                    <span>角色工作台入口</span>
                </div>
                <div class="brand-signal" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="auth-visual" aria-hidden="true">
                <div class="auth-orbit orbit-a"></div>
                <div class="auth-orbit orbit-b"></div>
                <div class="auth-shield">
                    <div class="shield-core">SE</div>
                    <div class="shield-keyhole"></div>
                </div>
                <div class="auth-node node-a"></div>
                <div class="auth-node node-b"></div>
                <div class="auth-node node-c"></div>
                <div class="auth-stream stream-a">0101 1100  AES  TOKEN  CLOUD</div>
                <div class="auth-stream stream-b">WRITER-KEY  INDEX  QUERY  PROOF</div>
            </div>

            <div class="auth-copy-block">
                <p class="auth-kicker">Cloud ciphertext access gateway</p>
                <h1>角色认证登录</h1>
                <p class="subtitle">选择审计员、写者或管理员身份，进入云端密文检索工作台。</p>
            </div>

            <div class="auth-status-strip" aria-hidden="true">
                <div>
                    <strong>Multi-writer</strong>
                    <span>多写者索引</span>
                </div>
                <div>
                    <strong>Encrypted</strong>
                    <span>云端密文域</span>
                </div>
                <div>
                    <strong>Auditable</strong>
                    <span>检索留痕</span>
                </div>
            </div>
        </section>

        <section class="card auth-card">
            <div class="auth-card-head">
                <p class="auth-kicker">Secure session</p>
                <h2>登录</h2>
                <p>请确认角色身份后进入对应控制台。</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-role">角色</label>
                    <select id="login-role" required>
                        <option value="reader">读者（审计员）</option>
                        <option value="writer">写者</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>

                <div class="form-group" id="reader-username-group">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username" value="reader" autocomplete="username">
                </div>

                <div class="form-group" id="writer-id-group" style="display: none;">
                    <label for="login-writer-id">写者 ID（0-based）</label>
                    <input type="number" id="login-writer-id" min="0" placeholder="例如: 0">
                </div>

                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" required autocomplete="current-password" placeholder="输入密码">
                    <small id="login-hint" class="login-hint-hidden" aria-hidden="true"></small>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">登录</span>
                    <span class="btn-loading" style="display: none;">登录中...</span>
                </button>
            </form>
            <div id="login-result" class="result-message" style="display: none; margin-top: 1rem;"></div>
        </section>
    </main>

    <div id="toast" class="toast"></div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
